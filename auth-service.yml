server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/finflow_auth?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQL8Dialect

jwt:
  secret: finflow-super-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400000

