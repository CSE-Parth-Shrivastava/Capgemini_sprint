server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
          filters:
            - JwtAuthFilter

        - id: application-service
          uri: http://localhost:8082
          predicates:
            - Path=/applications/**
          filters:
            - JwtAuthFilter

        - id: document-service
          uri: http://localhost:8083
          predicates:
            - Path=/documents/**
          filters:
            - JwtAuthFilter

        - id: admin-service
          uri: http://localhost:8084
          predicates:
            - Path=/admin/**
          filters:
            - JwtAuthFilter

        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/notifications/**
          filters:
            - JwtAuthFilter

jwt:
  secret: finflow-super-secret-key-must-be-at-least-256-bits-long-for-hs256


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
