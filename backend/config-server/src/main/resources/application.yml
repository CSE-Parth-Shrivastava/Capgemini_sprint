server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/CSE-Parth-Shrivastava/sprint_configs
          clone-on-start: true
          default-label: main
          search-paths: /
          # Timeout settings for Docker environment
          timeout: 10
          # Skip SSL verification if needed
          skip-ssl-validation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always


