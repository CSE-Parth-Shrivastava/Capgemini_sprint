spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  cloud:
    config:
      enabled: false
  config:
    import: optional:configserver:
eureka:
  client:
    enabled: false

jwt:
  secret: test-secret-key-which-is-at-least-32-characters-long
  expiration: 86400000
