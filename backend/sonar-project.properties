# ──────────────────────────────────────────────────────────────────────────────
# SonarQube Project Configuration — FinFlow Backend
# Run analysis: mvn verify sonar:sonar -Psonar
# ──────────────────────────────────────────────────────────────────────────────

sonar.projectKey=com.finflow:finflow-parent
sonar.projectName=FinFlow Backend
sonar.projectVersion=1.0.0

# Source encoding
sonar.sourceEncoding=UTF-8

# Java version
sonar.java.source=17

# Coverage reports — JaCoCo XML (generated by 'mvn verify')
sonar.coverage.jacoco.xmlReportPaths=\
  auth-service/target/site/jacoco/jacoco.xml,\
  application-service/target/site/jacoco/jacoco.xml,\
  admin-service/target/site/jacoco/jacoco.xml,\
  document-service/target/site/jacoco/jacoco.xml,\
  notification-service/target/site/jacoco/jacoco.xml,\
  api-gateway/target/site/jacoco/jacoco.xml,\
  config-server/target/site/jacoco/jacoco.xml,\
  eureka-server/target/site/jacoco/jacoco.xml

# Exclusions — generated/boilerplate code that should not count toward coverage
sonar.exclusions=\
  **/entity/**,\
  **/dto/**,\
  **/exception/**,\
  **/*Application.java,\
  **/config/**,\
  **/META-INF/**

# Test source directories
sonar.tests=\
  auth-service/src/test/java,\
  application-service/src/test/java,\
  admin-service/src/test/java,\
  document-service/src/test/java,\
  notification-service/src/test/java,\
  api-gateway/src/test/java,\
  config-server/src/test/java,\
  eureka-server/src/test/java

# SonarQube Quality Gate — fail the build if the gate is not passed
sonar.qualitygate.wait=true
