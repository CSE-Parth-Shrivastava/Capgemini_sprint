spring:
  application:
    name: eureka-server

server:
  port: 8761

# Eureka server — does not register itself or fetch from itself
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  instance:
    hostname: localhost

# Actuator — needed for docker-compose healthcheck
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

